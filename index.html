<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Odam – Basit Oda Tasarımı</title>
<style>
:root{--bg:#f6f1ea;--ink:#3a3330;--muted:#8a7f78;--accent:#c8775a;--accent2:#ecdcd0;--line:#e4dad1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{padding:10px 12px 6px;display:flex;align-items:center;gap:8px}
h1{font-size:18px;margin:0;white-space:nowrap}
h1 span{color:var(--accent)}
.tabs{display:flex;background:var(--accent2);border-radius:12px;padding:3px;margin-left:auto}
.tabs button{border:0;background:transparent;padding:7px 11px;border-radius:9px;font-weight:600;color:var(--ink);font-size:14px}
.tabs button.on{background:#fff;box-shadow:0 1px 3px #0002}
.room{display:flex;gap:8px;padding:0 12px 8px;align-items:end}
.room label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.room input{width:68px;padding:7px 8px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff}
#stage{flex:1;position:relative;margin:0 10px;border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 1px 4px #0001;touch-action:none;min-height:200px}
#plan,#view3d{position:absolute;inset:0;width:100%;height:100%}
#view3d{display:none}
.hint{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--muted);pointer-events:none;background:#fffd;padding:3px 7px;border-radius:8px}
#sel{display:none;margin:8px 10px 0;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:0 1px 4px #0001;gap:6px;align-items:center;flex-wrap:wrap}
#sel.on{display:flex}
#sel b{font-size:14px;width:100%}
#sel label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px}
#sel input[type=number]{width:56px;padding:5px;border:1px solid var(--line);border-radius:8px;font-size:14px}
#sel input[type=color]{width:32px;height:30px;border:0;padding:0;background:none}
.btn{border:0;background:var(--accent2);color:var(--ink);padding:7px 10px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.btn.red{background:#f3d4cf;color:#a33}
.btn.main{background:var(--accent);color:#fff}
.palette{display:flex;gap:8px;overflow-x:auto;padding:10px;scrollbar-width:none}
.palette::-webkit-scrollbar{display:none}
.palette button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:14px;padding:7px 9px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:72px;color:var(--ink);cursor:pointer}
.palette button i{font-style:normal;font-size:22px}
.palette button small{color:var(--muted);font-size:10px}
dialog{border:0;border-radius:16px;padding:16px;width:min(320px,90vw)}
dialog h3{margin:0 0 6px}
dialog label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
dialog input{width:100%;padding:8px;border:1px solid var(--line);border-radius:10px;font-size:15px}
dialog .row{display:flex;gap:8px}
dialog .row>div{flex:1}
dialog .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
</style>
</head>
<body>
<header>
  <h1>🏠 Odam <span>tasarım</span></h1>
  <div class="tabs"><button id="t2" class="on">2D Plan</button><button id="t3">3D Görünüm</button></div>
</header>
<div class="room">
  <label>Genişlik (m)<input id="rw" type="number" step="0.1" min="1" max="20"></label>
  <label>Uzunluk (m)<input id="rl" type="number" step="0.1" min="1" max="20"></label>
  <label>Tavan (m)<input id="rh" type="number" step="0.1" min="2" max="5"></label>
  <button class="btn red" id="clear" style="margin-left:auto">Temizle</button>
</div>
<div id="stage">
  <canvas id="plan"></canvas>
  <div id="view3d"></div>
  <div class="hint" id="hint">Aşağıdan mobilya ekle • parmağınla sürükle • dokunarak seç</div>
</div>
<div id="sel">
  <b id="sname"></b>
  <label>En<input id="sw" type="number" min="5" max="2000"></label>
  <label>Derinlik<input id="sd" type="number" min="5" max="2000"></label>
  <label>Yükseklik<input id="sh" type="number" min="1" max="500"></label>
  <label>cm</label>
  <input id="sc" type="color">
  <button class="btn" id="srot">↻ Döndür</button>
  <button class="btn" id="scopy">⧉ Kopyala</button>
  <button class="btn red" id="sdel">🗑 Sil</button>
</div>
<div class="palette" id="pal"></div>

<dialog id="dlg">
  <h3>Özel mobilya</h3>
  <label>Adı</label><input id="cn" value="Konsol">
  <div class="row">
    <div><label>En (cm)</label><input id="cw" type="number" value="120"></div>
    <div><label>Derinlik</label><input id="cd" type="number" value="40"></div>
    <div><label>Yükseklik</label><input id="ch" type="number" value="80"></div>
  </div>
  <label>Renk</label><input id="cc" type="color" value="#b48a6a" style="height:40px">
  <div class="acts"><button class="btn" id="cx">Vazgeç</button><button class="btn main" id="ck">Ekle</button></div>
</dialog>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const CAT=[
 {type:'sofa',name:'Kanepe',icon:'🛋️',w:210,d:90,h:85,color:'#8a9a8b'},
 {type:'sofa',name:'Berjer',icon:'💺',w:85,d:85,h:85,color:'#c8a27a'},
 {type:'bed',name:'Çift Yatak',icon:'🛏️',w:160,d:200,h:100,color:'#e8e1d8'},
 {type:'bed',name:'Tek Yatak',icon:'🛏️',w:90,d:200,h:90,color:'#dfe6ee'},
 {type:'table',name:'Yemek Masası',icon:'🍽️',w:160,d:90,h:75,color:'#b08560'},
 {type:'table',name:'Sehpa',icon:'☕',w:100,d:60,h:40,color:'#a07850'},
 {type:'chair',name:'Sandalye',icon:'🪑',w:45,d:50,h:90,color:'#7d6650'},
 {type:'table',name:'Çalışma Masası',icon:'💻',w:120,d:60,h:75,color:'#d9c7b0'},
 {type:'cabinet',name:'Gardırop',icon:'🚪',w:180,d:60,h:220,color:'#efe9e1'},
 {type:'tv',name:'TV Ünitesi',icon:'📺',w:180,d:45,h:50,color:'#5b5550'},
 {type:'shelf',name:'Kitaplık',icon:'📚',w:80,d:35,h:180,color:'#c9a77c'},
 {type:'rug',name:'Halı',icon:'🟫',w:200,d:300,h:1,color:'#d8b4a0'},
 {type:'plant',name:'Bitki',icon:'🪴',w:45,d:45,h:120,color:'#6f9a63'},
 {type:'lamp',name:'Lambader',icon:'💡',w:40,d:40,h:160,color:'#f0d9a0'},
];
const BACKED={sofa:1,bed:1,chair:1,cabinet:1,tv:1,shelf:1};
const $=id=>document.getElementById(id);

let S=null;
try{S=JSON.parse(localStorage.getItem('odam-v1'))}catch(e){}
if(!S||!S.items)S={W:400,L:350,H:260,items:[]};
let selId=null, drag=null, mode='2d';
const save=()=>localStorage.setItem('odam-v1',JSON.stringify(S));
const cur=()=>S.items.find(i=>i.id===selId);
const fp=it=>(it.rot%180)?[it.d,it.w]:[it.w,it.d];
function clampIt(it){
  const [fw,fd]=fp(it);
  it.x=fw>=S.W?S.W/2:Math.min(Math.max(it.x,fw/2),S.W-fw/2);
  it.y=fd>=S.L?S.L/2:Math.min(Math.max(it.y,fd/2),S.L-fd/2);
}

// ---------- palette ----------
const pal=$('pal');
CAT.forEach(c=>{
  const b=document.createElement('button');
  b.innerHTML=`<i>${c.icon}</i>${c.name}<small>${c.w}×${c.d}</small>`;
  b.onclick=()=>addItem({...c});
  pal.appendChild(b);
});
const cb=document.createElement('button');
cb.innerHTML='<i>➕</i>Özel<small>ölçü gir</small>';
cb.onclick=()=>$('dlg').showModal();
pal.appendChild(cb);
$('cx').onclick=()=>$('dlg').close();
$('ck').onclick=()=>{
  addItem({type:'box',name:$('cn').value||'Mobilya',icon:'📦',w:+$('cw').value||50,d:+$('cd').value||50,h:+$('ch').value||50,color:$('cc').value});
  $('dlg').close();
};

function addItem(c){
  const it={id:Math.random().toString(36).slice(2,9),type:c.type,name:c.name,w:c.w,d:c.d,h:c.h,color:c.color,rot:0,x:S.W/2,y:S.L/2};
  let k=0; while(S.items.some(o=>Math.abs(o.x-it.x)<5&&Math.abs(o.y-it.y)<5)&&k<10){it.x+=20;it.y+=20;k++}
  clampIt(it); S.items.push(it); selId=it.id; changed();
}

// ---------- room inputs ----------
function roomUI(){ $('rw').value=S.W/100; $('rl').value=S.L/100; $('rh').value=S.H/100; }
roomUI();
['rw','rl','rh'].forEach(id=>$(id).addEventListener('change',()=>{
  const v=k=>Math.round(Math.min(Math.max(parseFloat($(k).value.replace(',','.'))||0,1),20)*100);
  S.W=v('rw'); S.L=v('rl'); S.H=Math.min(Math.max(v('rh'),200),500);
  S.items.forEach(clampIt); roomUI(); changed();
}));
$('clear').onclick=()=>{ if(confirm('Tüm mobilyalar silinsin mi?')){S.items=[];selId=null;changed();} };

// ---------- selection panel ----------
function selUI(){
  const it=cur(), p=$('sel');
  if(!it){p.classList.remove('on');return}
  p.classList.add('on');
  $('sname').textContent=it.name;
  $('sw').value=it.w; $('sd').value=it.d; $('sh').value=it.h; $('sc').value=it.color;
}
[['sw','w'],['sd','d'],['sh','h']].forEach(([id,k])=>$(id).addEventListener('change',()=>{
  const it=cur(); if(!it)return; const v=+$(id).value; if(v>0){it[k]=v; clampIt(it); changed();}
}));
$('sc').addEventListener('input',()=>{const it=cur(); if(it){it.color=$('sc').value; changed();}});
$('srot').onclick=()=>{const it=cur(); if(it){it.rot=(it.rot+90)%360; clampIt(it); changed();}};
$('sdel').onclick=()=>{S.items=S.items.filter(i=>i.id!==selId); selId=null; changed();};
$('scopy').onclick=()=>{const it=cur(); if(it) addItem({...it});};

function changed(){ save(); selUI(); draw(); if(mode==='3d') build3d(); }

// ---------- 2D plan ----------
const cv=$('plan'), ctx=cv.getContext('2d');
let V={s:1,ox:0,oy:0,cw:0,ch:0};
function resize(){
  const r=$('stage').getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  V.cw=r.width; V.ch=r.height; draw(); if(R) resize3d();
}
function view(){
  const pad=34, s=Math.min((V.cw-2*pad)/S.W,(V.ch-2*pad-10)/S.L);
  V.s=s; V.ox=(V.cw-S.W*s)/2; V.oy=(V.ch-S.L*s)/2-6;
}
const lum=h=>{const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255};
function shade(h,f){const n=parseInt(h.slice(1),16);const c=[n>>16,n>>8&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(v*f))));return'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
const fmt=v=>(v/100).toFixed(2).replace('.',',')+' m';
function rrect(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
const order=()=>[...S.items].sort((a,b)=>(a.type==='rug'?0:1)-(b.type==='rug'?0:1));

function draw(){
  if(!V.cw)return; view();
  const {s,ox,oy}=V;
  ctx.clearRect(0,0,V.cw,V.ch);
  // floor
  ctx.fillStyle='#f4ebdf'; ctx.fillRect(ox,oy,S.W*s,S.L*s);
  ctx.strokeStyle='#e6dacb'; ctx.lineWidth=1;
  for(let x=50;x<S.W;x+=50){ctx.beginPath();ctx.moveTo(ox+x*s,oy);ctx.lineTo(ox+x*s,oy+S.L*s);ctx.stroke()}
  for(let y=50;y<S.L;y+=50){ctx.beginPath();ctx.moveTo(ox,oy+y*s);ctx.lineTo(ox+S.W*s,oy+y*s);ctx.stroke()}
  // walls
  ctx.strokeStyle='#5a4f48'; ctx.lineWidth=7; ctx.strokeRect(ox-3.5,oy-3.5,S.W*s+7,S.L*s+7);
  // dims
  ctx.fillStyle='#8a7f78'; ctx.font='600 12px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(fmt(S.W),ox+S.W*s/2,oy-18);
  ctx.save(); ctx.translate(ox-18,oy+S.L*s/2); ctx.rotate(-Math.PI/2); ctx.fillText(fmt(S.L),0,0); ctx.restore();
  // items
  for(const it of order()){
    ctx.save(); ctx.translate(ox+it.x*s,oy+it.y*s); ctx.rotate(it.rot*Math.PI/180);
    const w=it.w*s,d=it.d*s;
    ctx.globalAlpha=it.type==='rug'?.85:1;
    ctx.fillStyle=it.color; ctx.strokeStyle=shade(it.color,.7); ctx.lineWidth=1.5;
    if(it.type==='plant'||it.type==='lamp'){ctx.beginPath();ctx.ellipse(0,0,w/2,d/2,0,0,Math.PI*2);ctx.fill();ctx.stroke()}
    else{rrect(-w/2,-d/2,w,d,Math.min(8,w*.1));ctx.fill();ctx.stroke()}
    if(BACKED[it.type]){const bh=Math.max(3,Math.min(14,it.d*.18)*s);ctx.fillStyle=shade(it.color,.75);rrect(-w/2,-d/2,w,bh,3);ctx.fill()}
    if(it.type==='bed'){ctx.fillStyle='#ffffffcc';const pw=it.w>120?w/2-6:w-8;for(let i=0;i<(it.w>120?2:1);i++){rrect(-w/2+4+i*(pw+4),-d/2+Math.min(14,it.d*.18)*s+3,pw,Math.min(20*s,d*.15),4);ctx.fill()}}
    ctx.restore();
    if(it.id===selId){const [fw,fd]=fp(it);ctx.save();ctx.setLineDash([5,4]);ctx.strokeStyle='#c8775a';ctx.lineWidth=2;ctx.strokeRect(ox+(it.x-fw/2)*s-4,oy+(it.y-fd/2)*s-4,fw*s+8,fd*s+8);ctx.restore()}
    const [fw]=fp(it); const fs=Math.max(9,Math.min(13,fw*s/7));
    ctx.font=`600 ${fs}px system-ui`; ctx.fillStyle=lum(it.color)>.6?'#3a3330':'#fff';
    if(fw*s>34) ctx.fillText(it.name,ox+it.x*s,oy+it.y*s+(it.id===selId?-7:0));
    if(it.id===selId){ctx.font='500 10px system-ui';ctx.fillText(`${fw}×${fp(it)[1]}`,ox+it.x*s,oy+it.y*s+8)}
  }
  if(!S.items.length){ctx.fillStyle='#b3a69c';ctx.font='500 14px system-ui';ctx.fillText('👇 Aşağıdan bir mobilya ekle',V.cw/2,V.ch/2)}
}
const toCm=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-V.ox)/V.s,y:(e.clientY-r.top-V.oy)/V.s}};
function pick(p){
  const arr=order().reverse();
  for(const it of arr){const [fw,fd]=fp(it);if(Math.abs(p.x-it.x)<=fw/2+4&&Math.abs(p.y-it.y)<=fd/2+4)return it}
  return null;
}
cv.addEventListener('pointerdown',e=>{
  const p=toCm(e), it=pick(p);
  if(it){selId=it.id;drag={id:it.id,dx:p.x-it.x,dy:p.y-it.y};cv.setPointerCapture(e.pointerId)}
  else selId=null;
  selUI(); draw();
});
cv.addEventListener('pointermove',e=>{
  if(!drag)return; const it=S.items.find(i=>i.id===drag.id); if(!it)return;
  const p=toCm(e); it.x=Math.round((p.x-drag.dx)/5)*5; it.y=Math.round((p.y-drag.dy)/5)*5; clampIt(it); draw();
});
const end=()=>{if(drag){drag=null;save()}};
cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);

// ---------- 3D ----------
let R=null, scene, cam, ctrl, roomG, walls=[], running=false;
function init3d(){
  R=new THREE.WebGLRenderer({antialias:true});
  R.setPixelRatio(Math.min(devicePixelRatio,2)); R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFSoftShadowMap;
  $('view3d').appendChild(R.domElement);
  scene=new THREE.Scene(); scene.background=new THREE.Color('#f6f1ea');
  cam=new THREE.PerspectiveCamera(45,1,0.05,200);
  ctrl=new OrbitControls(cam,R.domElement); ctrl.enableDamping=true; ctrl.maxPolarAngle=Math.PI/2-0.03; ctrl.minDistance=1;
  scene.add(new THREE.HemisphereLight('#ffffff','#b9a48e',1.1));
  const sun=new THREE.DirectionalLight('#fff4e5',1.6); sun.position.set(3,7,4); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048); sun.shadow.bias=-0.0005; scene.add(sun); scene.userData.sun=sun;
  roomG=new THREE.Group(); scene.add(roomG);
  resize3d(); resetCam();
}
function resetCam(){
  const W=S.W/100,L=S.L/100,m=Math.max(W,L);
  cam.position.set(W*0.7,m*1.15+1,L*0.5+m*1.1); ctrl.target.set(0,0.4,0); ctrl.update();
}
function resize3d(){const r=$('stage').getBoundingClientRect();R.setSize(r.width,r.height);cam.aspect=r.width/r.height;cam.updateProjectionMatrix()}
const MATS={};
const mat=(c,o={})=>{const k=c+JSON.stringify(o);return MATS[k]||(MATS[k]=new THREE.MeshStandardMaterial({color:c,roughness:.8,...o}))};
function box(g,w,h,d,c,x,y,z,o){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c,o));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;g.add(m);return m}
function cyl(g,rt,rb,h,c,x,y,z,o){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,24),mat(c,o));m.position.set(x,y,z);m.castShadow=true;g.add(m);return m}
function legs(g,w,d,h,c,t=.045){for(const sx of[-1,1])for(const sz of[-1,1])box(g,t,h,t,c,sx*(w/2-t),h/2,sz*(d/2-t))}
function makeItem(it){
  const g=new THREE.Group(), w=it.w/100,d=it.d/100,h=Math.max(it.h,1)/100,c=it.color,dk=shade(c,.78);
  switch(it.type){
    case'sofa':{const aw=Math.min(.18,w*.14);box(g,w,h*.45,d,c,0,h*.225,0);box(g,w,h,d*.22,dk,0,h/2,-d/2+d*.11);
      for(const s of[-1,1])box(g,aw,h*.65,d,dk,s*(w/2-aw/2),h*.325,0);
      const n=w>1.3?2:1,cw=(w-2*aw)/n;for(let i=0;i<n;i++)box(g,cw-.02,.1,d*.72,shade(c,1.08),-w/2+aw+cw*(i+.5),h*.45+.05,d*.11);break}
    case'bed':{const wood='#9c7a5b';box(g,w,.3,d,wood,0,.15,0);box(g,w-.04,.2,d-.06,c,0,.4,.02);box(g,w,h,.06,wood,0,h/2,-d/2+.03);
      const n=w>1.2?2:1,pw=(w-.1)/n;for(let i=0;i<n;i++)box(g,pw-.06,.12,.35,'#ffffff',-w/2+.05+pw*(i+.5),.56,-d/2+.3);
      box(g,w-.02,.04,d*.55,shade(c,.9),0,.52,d*.2);break}
    case'table':{box(g,w,.04,d,c,0,h-.02,0);legs(g,w,d,h-.04,dk);break}
    case'chair':{const sh=Math.min(.45,h*.5);box(g,w,.05,d,c,0,sh,0);legs(g,w,d,sh-.025,dk,.035);box(g,w,h-sh,.04,c,0,sh+(h-sh)/2,-d/2+.02);break}
    case'cabinet':{box(g,w,h,d,c,0,h/2,0);const n=Math.max(1,Math.round(w/.6));for(let i=1;i<n;i++)box(g,.008,h*.96,.01,dk,-w/2+w*i/n,h/2,d/2);
      for(let i=0;i<n;i++)box(g,.02,.15,.02,'#9a9a9a',-w/2+w*(i+.5)/n+.05,h*.5,d/2+.015);break}
    case'tv':{box(g,w,h,d,c,0,h/2,0);const sw=Math.min(w*.8,1.45),shh=sw*.57;box(g,.25,.02,.15,'#222',0,h+.01,0);box(g,.04,.08,.04,'#222',0,h+.05,0);
      box(g,sw,shh,.04,'#111',0,h+.09+shh/2,0,{roughness:.3});break}
    case'shelf':{box(g,w,h,.015,dk,0,h/2,-d/2+.008);for(const s of[-1,1])box(g,.02,h,d,c,s*(w/2-.01),h/2,0);
      const n=Math.max(2,Math.floor(h/.35));const cols=['#a34a3c','#3e5f7a','#d9b45a','#5f7e57','#7a5a7e','#e0d6c8'];
      for(let i=0;i<=n;i++){const y=.01+i*(h-.02)/n;box(g,w,.02,d,c,0,y,0);
        if(i<n){let x=-w/2+.04,k=i;while(x<w/2-.08&&Math.random()>.12){const bw=.025+Math.random()*.03,bh=Math.min(.28,(h-.02)/n-.04)*(.75+Math.random()*.25);box(g,bw,bh,d*.75,cols[k++%cols.length],x+bw/2,y+.01+bh/2,0);x+=bw+.004}}}
      break}
    case'rug':{const m=box(g,w,.012,d,c,0,.006,0);m.castShadow=false;break}
    case'plant':{const r=Math.min(w,d)/2;cyl(g,r*.75,r*.55,Math.min(.35,h*.3),'#b8674a',0,Math.min(.35,h*.3)/2,0);
      const top=Math.min(.35,h*.3);for(const [dx,dy,dz,s] of[[0,.55,0,1],[r*.35,.35,r*.2,.75],[-r*.3,.4,-r*.25,.7]]){
        const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r*1.05*s,1),mat(c,{flatShading:true}));m.position.set(dx,top+(h-top)*dy+r*.2,dz);m.castShadow=true;g.add(m)}break}
    case'lamp':{cyl(g,.15,.15,.03,'#333',0,.015,0);cyl(g,.012,.012,h-.3,'#333',0,(h-.3)/2,0);cyl(g,.12,.2,.3,c,0,h-.15,0,{emissive:c,emissiveIntensity:.35});break}
    default:box(g,w,h,d,c,0,h/2,0);
  }
  g.position.set(it.x/100-S.W/200,0,it.y/100-S.L/200); g.rotation.y=-it.rot*Math.PI/180;
  return g;
}
let lastRoom='';
function build3d(){
  if(!R)return;
  roomG.traverse(o=>{if(o.geometry)o.geometry.dispose()}); roomG.clear(); walls=[];
  const W=S.W/100,L=S.L/100,H=S.H/100,t=.1;
  const fl=new THREE.Mesh(new THREE.BoxGeometry(W,.04,L),mat('#d6b994',{roughness:.7}));fl.position.y=-.02;fl.receiveShadow=true;roomG.add(fl);
  const wc='#efe7dd';
  const defs=[[W+2*t,t,0,-L/2-t/2,[0,0,-1],L/2],[W+2*t,t,0,L/2+t/2,[0,0,1],L/2],[t,L,-W/2-t/2,0,[-1,0,0],W/2],[t,L,W/2+t/2,0,[1,0,0],W/2]];
  for(const [a,b,x,z,n,lim] of defs){const m=box(roomG,a,H,b,wc,x,H/2,z);m.userData={n:new THREE.Vector3(...n),lim};walls.push(m)}
  for(const it of S.items) roomG.add(makeItem(it));
  const sun=scene.userData.sun,m=Math.max(W,L);const sc=sun.shadow.camera;sc.left=sc.bottom=-m;sc.right=sc.top=m;sc.near=.5;sc.far=30;sc.updateProjectionMatrix();
  const key=S.W+'x'+S.L; if(key!==lastRoom){lastRoom=key;resetCam()}
}
function loop(){
  if(!running)return; requestAnimationFrame(loop); ctrl.update();
  for(const w of walls){w.visible=!(cam.position.dot(w.userData.n)>w.userData.lim)}
  R.render(scene,cam);
}
function setMode(m){
  mode=m; $('t2').classList.toggle('on',m==='2d'); $('t3').classList.toggle('on',m==='3d');
  $('plan').style.display=m==='2d'?'block':'none'; $('view3d').style.display=m==='3d'?'block':'none';
  $('hint').textContent=m==='2d'?'Aşağıdan mobilya ekle • parmağınla sürükle • dokunarak seç':'Tek parmakla çevir • iki parmakla yakınlaştır';
  if(m==='3d'){ if(!R)init3d(); resize3d(); build3d(); if(!running){running=true;loop()} } else { running=false; draw(); }
}
$('t2').onclick=()=>setMode('2d'); $('t3').onclick=()=>setMode('3d');
new ResizeObserver(resize).observe($('stage'));
resize(); selUI();
</script>
